name = "meeting-archive"
main = "worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "MEETING_KV"
id = "REPLACE_WITH_KV_ID"
preview_id = "REPLACE_WITH_KV_PREVIEW_ID"

[[r2_buckets]]
binding = "MEETING_R2"
bucket_name = "meeting-files"

# Secrets (set via: npx wrangler secret put SECRET_NAME)
# GEMINI_API_KEY
# SITE_PW  (팀 공유 비밀번호)
