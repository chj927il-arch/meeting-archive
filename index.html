<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>회의록 아카이브</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@600;700&display=swap" />
  <style>
    :root {
      --bg: #f5f4f0;
      --bg-card: #ffffff;
      --bg-side: #edeae4;
      --fg: #1a1916;
      --fg-muted: #6b6760;
      --fg-subtle: #9c9890;
      --border: #e0dbd2;
      --accent: #1e4d8c;
      --accent-lt: #e8eef7;
      --accent-dim: #5a7fb5;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
      --shadow-md: 0 4px 16px rgba(0,0,0,.10);
      --r: 8px;
      --drop-border: #93b4de;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #131210; --bg-card: #1c1b17; --bg-side: #171612;
        --fg: #f0ede8; --fg-muted: #a09d97; --fg-subtle: #6b6760;
        --border: #2d2c27; --accent: #5a90d9; --accent-lt: #182438; --accent-dim: #4a78b8;
        --shadow-sm: 0 1px 3px rgba(0,0,0,.3); --shadow-md: 0 4px 16px rgba(0,0,0,.4);
        --drop-border: #3a6090;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #131210; --bg-card: #1c1b17; --bg-side: #171612;
      --fg: #f0ede8; --fg-muted: #a09d97; --fg-subtle: #6b6760;
      --border: #2d2c27; --accent: #5a90d9; --accent-lt: #182438; --accent-dim: #4a78b8;
      --shadow-sm: 0 1px 3px rgba(0,0,0,.3); --shadow-md: 0 4px 16px rgba(0,0,0,.4);
      --drop-border: #3a6090;
      color-scheme: dark;
    }

    [hidden] { display: none !important; }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: var(--bg); color: var(--fg);
      font-size: 14px; line-height: 1.6;
      display: flex; flex-direction: column;
    }

    /* ── 헤더 ── */
    .hdr {
      height: 54px; padding: 0 24px;
      background: var(--bg-card); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: env(safe-area-inset-top,0); z-index: 100;
      box-shadow: var(--shadow-sm);
    }
    .hdr-logo { font-family: 'Noto Serif KR', serif; font-size: 17px; font-weight: 700; }
    .hdr-logo span { color: var(--accent); }
    .hdr-right { display: flex; gap: 8px; align-items: center; }

    /* ── 레이아웃 ── */
    .layout { display: flex; flex: 1; min-height: 0; overflow: hidden; }

    /* ── 사이드바 ── */
    .side {
      width: 240px; flex-shrink: 0;
      background: var(--bg-side); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; overflow-y: auto; padding: 16px 12px;
      gap: 20px;
    }
    .side-sec-label {
      font-size: 10px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--fg-subtle); margin-bottom: 6px;
    }
    .search-box {
      position: relative;
    }
    .search-box svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--fg-subtle); pointer-events: none; }
    .search-box input {
      width: 100%; padding: 7px 10px 7px 30px;
      border: 1px solid var(--border); border-radius: var(--r);
      background: var(--bg-card); color: var(--fg);
      font-family: inherit; font-size: 13px; outline: none;
    }
    .search-box input:focus { border-color: var(--accent-dim); }

    .filter-list { display: flex; flex-direction: column; gap: 2px; }
    .fbtn {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 10px; border-radius: 6px; border: none;
      background: none; color: var(--fg-muted); font-family: inherit;
      font-size: 13px; cursor: pointer; text-align: left; width: 100%;
      transition: background .12s, color .12s;
    }
    .fbtn:hover { background: var(--border); color: var(--fg); }
    .fbtn.on { background: var(--accent-lt); color: var(--accent); font-weight: 600; }
    .fbtn .cnt {
      font-size: 11px; padding: 1px 6px; border-radius: 20px;
      background: var(--border); color: var(--fg-subtle);
      font-variant-numeric: tabular-nums;
    }
    .fbtn.on .cnt { background: var(--accent); color: #fff; }

    /* ── 메인 ── */
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

    .toolbar {
      padding: 12px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px;
    }
    .result-info { font-size: 13px; color: var(--fg-muted); }
    .sort-sel {
      padding: 5px 10px; border: 1px solid var(--border); border-radius: 6px;
      background: var(--bg-card); color: var(--fg); font-family: inherit; font-size: 13px; outline: none;
    }

    /* ── 드롭존 ── */
    .drop-zone {
      margin: 16px 20px; border: 2px dashed var(--drop-border);
      border-radius: 10px; padding: 20px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      text-align: center; cursor: pointer; transition: background .15s, border-color .15s;
      background: var(--accent-lt);
    }
    .drop-zone:hover, .drop-zone.dragover {
      background: var(--accent-lt); border-color: var(--accent);
    }
    .drop-zone.dragover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
    .drop-icon { font-size: 28px; }
    .drop-text { font-size: 13px; color: var(--fg-muted); }
    .drop-text strong { color: var(--accent); }
    .drop-sub { font-size: 11px; color: var(--fg-subtle); }
    #file-input { display: none; }

    /* ── 파일 카드 목록 ── */
    .card-list {
      flex: 1; overflow-y: auto; padding: 0 20px 20px;
      display: flex; flex-direction: column; gap: 10px;
    }

    .fcard {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: var(--r); padding: 14px 16px;
      display: grid; grid-template-columns: auto 1fr auto;
      gap: 12px; align-items: start;
      cursor: pointer; transition: box-shadow .15s, border-color .15s;
    }
    .fcard:hover { box-shadow: var(--shadow-md); border-color: var(--accent-dim); }

    .file-icon {
      width: 40px; height: 48px; border-radius: 5px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-size: 10px; font-weight: 700; letter-spacing: .03em;
      flex-shrink: 0;
    }
    .fi-pdf  { background: #fde8e8; color: #c0392b; }
    .fi-word { background: #dbeafe; color: #1d4ed8; }
    .fi-hwp  { background: #dcfce7; color: #166534; }
    .fi-other{ background: var(--bg-side); color: var(--fg-muted); }

    .fcard-body { min-width: 0; }
    .fcard-title {
      font-family: 'Noto Serif KR', serif; font-size: 15px; font-weight: 600;
      margin-bottom: 3px; line-height: 1.4;
    }
    .fcard-meta { font-size: 12px; color: var(--fg-muted); display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 6px; }
    .fcard-meta span { display: flex; align-items: center; gap: 3px; }
    .fcard-tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .tag {
      font-size: 11px; font-weight: 600; padding: 2px 7px;
      border-radius: 20px; background: var(--accent-lt); color: var(--accent);
    }
    .cat-tag {
      font-size: 11px; font-weight: 700; padding: 2px 8px;
      border-radius: 20px; background: var(--border); color: var(--fg-muted);
    }

    .fcard-actions { display: flex; flex-direction: column; gap: 5px; align-items: flex-end; flex-shrink: 0; }

    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 14px; border-radius: 6px; border: none;
      cursor: pointer; font-family: inherit; font-size: 13px; font-weight: 600;
      transition: opacity .12s;
    }
    .btn:active { opacity: .8; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-dim); }
    .btn-ghost { background: transparent; color: var(--fg-muted); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg-side); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }
    .btn-del { color: #c0392b; border: 1px solid transparent; background: none; }
    .btn-del:hover { background: #fef2f2; border-color: #fecaca; }

    /* ── 빈 상태 ── */
    .empty {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 10px;
      color: var(--fg-subtle); padding: 40px; text-align: center;
    }
    .empty-icon { font-size: 44px; opacity: .35; }
    .empty h3 { font-size: 15px; color: var(--fg-muted); }
    .empty p { font-size: 13px; }

    /* ── 모달 공통 ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.5);
      display: flex; align-items: flex-start; justify-content: center;
      z-index: 300; padding: 32px 16px; overflow-y: auto;
    }
    .modal {
      background: var(--bg-card); border-radius: 12px;
      width: 100%; max-width: 600px; margin: auto;
      box-shadow: var(--shadow-md);
    }
    .modal-hd {
      padding: 18px 22px 14px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-hd h2 { font-family: 'Noto Serif KR', serif; font-size: 16px; font-weight: 700; }
    .modal-x {
      width: 28px; height: 28px; border-radius: 50%; border: none;
      background: var(--bg-side); color: var(--fg-muted);
      cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center;
    }
    .modal-x:hover { background: var(--border); }
    .modal-bd { padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
    .modal-ft { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; }

    /* ── 폼 ── */
    .fg { display: flex; flex-direction: column; gap: 5px; }
    .fl { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--fg-muted); }
    .fi, .fta {
      padding: 8px 11px; border: 1px solid var(--border); border-radius: var(--r);
      background: var(--bg); color: var(--fg); font-family: inherit; font-size: 14px; outline: none;
      transition: border-color .15s; width: 100%;
    }
    .fi:focus, .fta:focus { border-color: var(--accent-dim); }
    .fta { resize: vertical; min-height: 80px; line-height: 1.6; }
    .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    /* 태그 입력 */
    .tag-wrap {
      display: flex; flex-wrap: wrap; gap: 5px; align-items: center;
      border: 1px solid var(--border); border-radius: var(--r);
      padding: 5px 9px; background: var(--bg); min-height: 38px; cursor: text;
    }
    .tag-wrap:focus-within { border-color: var(--accent-dim); }
    .tchip { display: flex; align-items: center; gap: 3px; background: var(--accent-lt); color: var(--accent); font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 20px; }
    .tchip button { border: none; background: none; color: inherit; cursor: pointer; font-size: 13px; line-height: 1; padding: 0; opacity: .6; }
    .tchip button:hover { opacity: 1; }
    .tag-in { border: none; outline: none; background: transparent; color: var(--fg); font-family: inherit; font-size: 13px; min-width: 70px; flex: 1; }

    /* 파일 선택 표시 */
    .file-chosen {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border: 1px solid var(--border);
      border-radius: var(--r); background: var(--bg);
    }
    .file-chosen .fc-name { flex: 1; font-size: 13px; color: var(--fg); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-chosen .fc-size { font-size: 12px; color: var(--fg-subtle); flex-shrink: 0; font-variant-numeric: tabular-nums; }

    /* ── 뷰어 모달 ── */
    .viewer-modal { max-width: 860px; }
    .viewer-meta { display: flex; gap: 20px; flex-wrap: wrap; padding-bottom: 14px; border-bottom: 1px solid var(--border); }
    .vm-item { display: flex; flex-direction: column; gap: 2px; }
    .vm-label { font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg-subtle); }
    .vm-value { font-size: 13px; font-weight: 500; }
    .viewer-note { font-size: 13px; color: var(--fg-muted); line-height: 1.7; white-space: pre-wrap; }
    .pdf-frame { width: 100%; height: 520px; border: 1px solid var(--border); border-radius: var(--r); }
    .download-box {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      padding: 32px; border: 1px solid var(--border); border-radius: var(--r);
      background: var(--bg);
    }
    .download-box .dl-icon { font-size: 40px; }
    .download-box p { font-size: 13px; color: var(--fg-muted); }

    /* 반응형 */
    @media (max-width: 700px) {
      .side { display: none; }
      .frow { grid-template-columns: 1fr; }
      .drop-zone { margin: 12px; }
      .card-list { padding: 0 12px 16px; }
      .toolbar { padding: 10px 12px; }
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  </style>
</head>
<body>

<header class="hdr">
  <div class="hdr-logo">회의록 <span>아카이브</span></div>
  <div class="hdr-right">
    <button class="btn btn-ghost btn-sm" onclick="toggleTheme()" id="theme-btn">🌙</button>
    <button class="btn btn-primary btn-sm" onclick="openUploadModal()">+ 파일 추가</button>
  </div>
</header>

<div class="layout">
  <!-- 사이드바 -->
  <aside class="side">
    <div>
      <div class="side-sec-label">검색</div>
      <div class="search-box">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="q" type="text" placeholder="제목, 참석자 검색…" oninput="render()" />
      </div>
    </div>
    <div>
      <div class="side-sec-label">카테고리</div>
      <div class="filter-list" id="cat-list"></div>
    </div>
    <div>
      <div class="side-sec-label">파일 유형</div>
      <div class="filter-list" id="type-list">
        <button class="fbtn on" data-type="all" onclick="setType('all')">전체<span class="cnt" id="cnt-all">0</span></button>
        <button class="fbtn" data-type="pdf" onclick="setType('pdf')">PDF<span class="cnt" id="cnt-pdf">0</span></button>
        <button class="fbtn" data-type="word" onclick="setType('word')">Word<span class="cnt" id="cnt-word">0</span></button>
        <button class="fbtn" data-type="hwp" onclick="setType('hwp')">한글(HWP)<span class="cnt" id="cnt-hwp">0</span></button>
      </div>
    </div>
    <div>
      <div class="side-sec-label">연도</div>
      <div class="filter-list" id="year-list"></div>
    </div>
  </aside>

  <!-- 메인 -->
  <main class="main">
    <div class="toolbar">
      <span class="result-info" id="result-info">0건</span>
      <select class="sort-sel" id="sort" onchange="render()">
        <option value="newest">최신순</option>
        <option value="oldest">오래된순</option>
        <option value="title">제목순</option>
      </select>
    </div>

    <!-- 드롭존 -->
    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()"
         ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
      <div class="drop-icon">📂</div>
      <div class="drop-text"><strong>클릭하거나 파일을 여기에 드래그</strong>해서 올려주세요</div>
      <div class="drop-sub">PDF · Word(.docx) · 한글(.hwp) · 모든 문서 파일 지원</div>
    </div>
    <input type="file" id="file-input" accept=".pdf,.doc,.docx,.hwp,.hwpx,.ppt,.pptx,.xls,.xlsx" multiple onchange="onFileSelect(event)" />

    <div class="card-list" id="card-list"></div>
  </main>
</div>

<!-- ── 업로드 메타 입력 모달 ── -->
<div class="overlay" id="upload-modal" hidden onclick="overlayClose(event,'upload-modal')">
  <div class="modal">
    <div class="modal-hd">
      <h2 id="upload-modal-title">회의록 파일 추가</h2>
      <button class="modal-x" onclick="closeModal('upload-modal')">✕</button>
    </div>
    <div class="modal-bd">
      <!-- 선택된 파일 표시 -->
      <div class="fg">
        <div class="fl">선택된 파일</div>
        <div class="file-chosen">
          <span id="chosen-icon" style="font-size:20px">📄</span>
          <span class="fc-name" id="chosen-name">-</span>
          <span class="fc-size" id="chosen-size">-</span>
        </div>
      </div>
      <div class="frow">
        <div class="fg">
          <label class="fl" for="m-date">날짜</label>
          <input class="fi" type="date" id="m-date" />
        </div>
        <div class="fg">
          <label class="fl" for="m-cat">카테고리</label>
          <input class="fi" type="text" id="m-cat" placeholder="예: 경영회의" list="cat-dl" />
          <datalist id="cat-dl"></datalist>
        </div>
      </div>
      <div class="fg">
        <label class="fl" for="m-title">회의 제목</label>
        <input class="fi" type="text" id="m-title" placeholder="회의 제목 (비워두면 파일명 사용)" />
      </div>
      <div class="fg">
        <label class="fl" for="m-attendees">참석자</label>
        <input class="fi" type="text" id="m-attendees" placeholder="예: 대표이사, 기획팀장, 마케팅팀장" />
      </div>
      <div class="fg">
        <div class="fl">태그</div>
        <div class="tag-wrap" onclick="document.getElementById('tag-in').focus()">
          <span id="tag-chips"></span>
          <input class="tag-in" id="tag-in" placeholder="입력 후 Enter" onkeydown="onTagKey(event)" />
        </div>
      </div>
      <div class="fg">
        <label class="fl" for="m-note">메모</label>
        <textarea class="fta" id="m-note" placeholder="회의 요약, 결정사항, 액션아이템 등…"></textarea>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="closeModal('upload-modal')">취소</button>
      <button class="btn btn-primary" onclick="saveMeta()">저장</button>
    </div>
  </div>
</div>

<!-- ── 뷰어 모달 ── -->
<div class="overlay" id="view-modal" hidden onclick="overlayClose(event,'view-modal')">
  <div class="modal viewer-modal">
    <div class="modal-hd">
      <h2 id="view-title" style="max-width:480px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></h2>
      <button class="modal-x" onclick="closeModal('view-modal')">✕</button>
    </div>
    <div class="modal-bd">
      <div class="viewer-meta" id="view-meta"></div>
      <div id="view-file-area"></div>
      <div class="fg" id="view-note-wrap" hidden>
        <div class="fl">메모</div>
        <div class="viewer-note" id="view-note"></div>
      </div>
      <div class="fcard-tags" id="view-tags"></div>
    </div>
    <div class="modal-ft">
      <button class="btn btn-ghost" onclick="closeModal('view-modal')">닫기</button>
      <button class="btn btn-ghost" id="view-edit-btn">편집</button>
    </div>
  </div>
</div>

<script>
// ────────────────────────────────────────────
// DB
// ────────────────────────────────────────────
const DB_NAME = 'meeting_archive', DB_VER = 1;
let db;

function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('files'))
        d.createObjectStore('files', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('meta'))
        d.createObjectStore('meta', { keyPath: 'id' });
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = () => rej(req.error);
  });
}
function dbPut(store, obj) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).put(obj).onsuccess = e => res(e.target.result);
    tx.onerror = () => rej(tx.error);
  });
}
function dbGetAll(store) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).getAll();
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function dbGet(store, key) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readonly');
    const req = tx.objectStore(store).get(key);
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
function dbDelete(store, key) {
  return new Promise((res, rej) => {
    const tx = db.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key).onsuccess = () => res();
    tx.onerror = () => rej(tx.error);
  });
}

// ────────────────────────────────────────────
// 상태
// ────────────────────────────────────────────
let records = [];   // 메타데이터 배열
let pendingFile = null;  // 업로드 대기 파일 {id, name, size, type, arrayBuffer}
let pendingFiles = [];   // 여러 파일 대기
let editingId = null;
let tags = [];
let filterCat = 'all', filterType = 'all', filterYear = 'all';

// ────────────────────────────────────────────
// 유틸
// ────────────────────────────────────────────
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function fileType(name) {
  const ext = (name || '').split('.').pop().toLowerCase();
  if (ext === 'pdf') return 'pdf';
  if (['doc','docx'].includes(ext)) return 'word';
  if (['hwp','hwpx'].includes(ext)) return 'hwp';
  return 'other';
}
function fileTypeLabel(t) {
  return { pdf:'PDF', word:'Word', hwp:'HWP', other:'기타' }[t] || '기타';
}
function fileIcon(t) {
  const map = { pdf: { cls:'fi-pdf', lbl:'PDF' }, word: { cls:'fi-word', lbl:'DOC' }, hwp: { cls:'fi-hwp', lbl:'HWP' }, other: { cls:'fi-other', lbl:'FILE' } };
  return map[t] || map.other;
}
function fileEmoji(t) { return { pdf:'📕', word:'📘', hwp:'📗', other:'📄' }[t] || '📄'; }
function fmtSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b/1024).toFixed(1) + ' KB';
  return (b/1048576).toFixed(1) + ' MB';
}
function fmtDate(d) {
  if (!d) return '';
  const [y,m,dd] = d.split('-');
  return `${y}년 ${+m}월 ${+dd}일`;
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ────────────────────────────────────────────
// 렌더
// ────────────────────────────────────────────
function getFiltered() {
  const q = (document.getElementById('q').value || '').toLowerCase().trim();
  let list = records.filter(r => {
    if (filterCat !== 'all' && r.category !== filterCat) return false;
    if (filterType !== 'all' && r.fileType !== filterType) return false;
    if (filterYear !== 'all' && !(r.date || '').startsWith(filterYear)) return false;
    if (q) {
      const hay = `${r.title} ${r.attendees} ${(r.tags||[]).join(' ')} ${r.note}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const sort = document.getElementById('sort').value;
  if (sort === 'newest') list.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  else if (sort === 'oldest') list.sort((a,b) => (a.date||'').localeCompare(b.date||''));
  else list.sort((a,b) => (a.title||'').localeCompare(b.title||''));
  return list;
}

function renderSidebar() {
  // 카테고리
  const cats = {};
  records.forEach(r => { const c = r.category||'미분류'; cats[c] = (cats[c]||0)+1; });
  const catEl = document.getElementById('cat-list');
  catEl.innerHTML =
    `<button class="fbtn ${filterCat==='all'?'on':''}" onclick="setCat('all')">전체<span class="cnt">${records.length}</span></button>` +
    Object.entries(cats).map(([c,n]) =>
      `<button class="fbtn ${filterCat===c?'on':''}" onclick="setCat('${esc(c)}')">${esc(c)}<span class="cnt">${n}</span></button>`
    ).join('');

  // 파일 유형 카운트
  const types = { pdf:0, word:0, hwp:0 };
  records.forEach(r => { if (types[r.fileType] !== undefined) types[r.fileType]++; });
  document.getElementById('cnt-all').textContent = records.length;
  document.getElementById('cnt-pdf').textContent = types.pdf;
  document.getElementById('cnt-word').textContent = types.word;
  document.getElementById('cnt-hwp').textContent = types.hwp;
  document.querySelectorAll('#type-list .fbtn').forEach(b => {
    b.classList.toggle('on', b.dataset.type === filterType);
  });

  // 연도
  const years = [...new Set(records.map(r => (r.date||'').slice(0,4)).filter(Boolean))].sort((a,b)=>b-a);
  const yearEl = document.getElementById('year-list');
  yearEl.innerHTML = years.map(y =>
    `<button class="fbtn ${filterYear===y?'on':''}" onclick="setYear('${y}')">${y}년</button>`
  ).join('');

  // 카테고리 datalist
  const dl = document.getElementById('cat-dl');
  if (dl) dl.innerHTML = Object.keys(cats).map(c=>`<option value="${esc(c)}">`).join('');
}

function render() {
  renderSidebar();
  const list = getFiltered();
  document.getElementById('result-info').textContent = `${list.length}건`;
  const el = document.getElementById('card-list');

  if (!list.length) {
    el.innerHTML = `<div class="empty">
      <div class="empty-icon">📋</div>
      <h3>${records.length===0 ? '저장된 회의록이 없습니다' : '검색 결과가 없습니다'}</h3>
      <p>${records.length===0 ? '위 영역에 파일을 드래그하거나 클릭해서 추가하세요.' : '다른 검색어나 필터를 사용해보세요.'}</p>
    </div>`;
    return;
  }

  el.innerHTML = list.map(r => {
    const fi = fileIcon(r.fileType);
    return `<div class="fcard" onclick="viewRecord('${r.id}')">
      <div class="file-icon ${fi.cls}">${fi.lbl}</div>
      <div class="fcard-body">
        <div class="fcard-title">${esc(r.title)}</div>
        <div class="fcard-meta">
          ${r.date ? `<span>📅 ${fmtDate(r.date)}</span>` : ''}
          ${r.attendees ? `<span>👥 ${esc(r.attendees)}</span>` : ''}
          ${r.fileName ? `<span>📎 ${esc(r.fileName)} ${r.fileSize?'('+fmtSize(r.fileSize)+')':''}</span>` : ''}
        </div>
        ${r.category || (r.tags&&r.tags.length) ? `<div class="fcard-tags">
          ${r.category ? `<span class="cat-tag">${esc(r.category)}</span>` : ''}
          ${(r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}
        </div>` : ''}
      </div>
      <div class="fcard-actions" onclick="event.stopPropagation()">
        <button class="btn btn-ghost btn-sm" onclick="editRecord('${r.id}')">편집</button>
        <button class="btn btn-sm btn-del" onclick="deleteRecord('${r.id}')">삭제</button>
      </div>
    </div>`;
  }).join('');
}

// ────────────────────────────────────────────
// 뷰어
// ────────────────────────────────────────────
async function viewRecord(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;
  document.getElementById('view-title').textContent = r.title;
  document.getElementById('view-meta').innerHTML = [
    r.date    ? `<div class="vm-item"><div class="vm-label">날짜</div><div class="vm-value">${fmtDate(r.date)}</div></div>` : '',
    r.category? `<div class="vm-item"><div class="vm-label">카테고리</div><div class="vm-value">${esc(r.category)}</div></div>` : '',
    r.attendees?`<div class="vm-item"><div class="vm-label">참석자</div><div class="vm-value">${esc(r.attendees)}</div></div>` : '',
    r.fileName? `<div class="vm-item"><div class="vm-label">파일</div><div class="vm-value">${esc(r.fileName)}${r.fileSize?' · '+fmtSize(r.fileSize):''}</div></div>` : '',
  ].join('');

  // 파일 영역
  const fileArea = document.getElementById('view-file-area');
  fileArea.innerHTML = '';
  if (r.fileId) {
    const stored = await dbGet('files', r.fileId).catch(()=>null);
    if (stored && stored.data) {
      if (r.fileType === 'pdf') {
        const blob = new Blob([stored.data], {type:'application/pdf'});
        const url = URL.createObjectURL(blob);
        fileArea.innerHTML = `<iframe class="pdf-frame" src="${url}"></iframe>`;
      } else {
        const blob = new Blob([stored.data]);
        const url = URL.createObjectURL(blob);
        fileArea.innerHTML = `<div class="download-box">
          <div class="dl-icon">${fileEmoji(r.fileType)}</div>
          <p>${esc(r.fileName)} (${fmtSize(r.fileSize)})</p>
          <a class="btn btn-primary" href="${url}" download="${esc(r.fileName)}">⬇ 파일 다운로드</a>
        </div>`;
      }
    }
  }

  const noteWrap = document.getElementById('view-note-wrap');
  if (r.note) { noteWrap.hidden = false; document.getElementById('view-note').textContent = r.note; }
  else noteWrap.hidden = true;

  document.getElementById('view-tags').innerHTML = (r.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('');
  document.getElementById('view-edit-btn').onclick = () => { closeModal('view-modal'); editRecord(id); };
  openModal('view-modal');
}

// ────────────────────────────────────────────
// 파일 드롭 / 선택
// ────────────────────────────────────────────
function onDragOver(e) { e.preventDefault(); document.getElementById('drop-zone').classList.add('dragover'); }
function onDragLeave() { document.getElementById('drop-zone').classList.remove('dragover'); }
function onDrop(e) {
  e.preventDefault();
  document.getElementById('drop-zone').classList.remove('dragover');
  const files = [...e.dataTransfer.files];
  if (files.length) handleFiles(files);
}
function onFileSelect(e) {
  const files = [...e.target.files];
  e.target.value = '';
  if (files.length) handleFiles(files);
}

async function handleFiles(files) {
  if (files.length === 1) {
    await prepareUploadModal(files[0]);
  } else {
    // 여러 파일: 순서대로 처리
    pendingFiles = files.slice(1);
    await prepareUploadModal(files[0]);
  }
}

async function prepareUploadModal(file) {
  const buf = await file.arrayBuffer();
  pendingFile = { id: uid(), name: file.name, size: file.size, type: file.type, buffer: buf };
  editingId = null;
  tags = [];

  const ft = fileType(file.name);
  document.getElementById('upload-modal-title').textContent = '회의록 파일 추가';
  document.getElementById('chosen-icon').textContent = fileEmoji(ft);
  document.getElementById('chosen-name').textContent = file.name;
  document.getElementById('chosen-size').textContent = fmtSize(file.size);
  document.getElementById('m-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('m-title').value = file.name.replace(/\.[^/.]+$/, '');
  document.getElementById('m-cat').value = '';
  document.getElementById('m-attendees').value = '';
  document.getElementById('m-note').value = '';
  renderTagChips();
  openModal('upload-modal');
}

// ────────────────────────────────────────────
// 저장
// ────────────────────────────────────────────
async function saveMeta() {
  const title = document.getElementById('m-title').value.trim() || (pendingFile ? pendingFile.name : '제목 없음');
  const meta = {
    id: editingId || (pendingFile ? pendingFile.id : uid()),
    title,
    date: document.getElementById('m-date').value,
    category: document.getElementById('m-cat').value.trim(),
    attendees: document.getElementById('m-attendees').value.trim(),
    note: document.getElementById('m-note').value.trim(),
    tags: [...tags],
  };

  if (pendingFile) {
    meta.fileId = pendingFile.id;
    meta.fileName = pendingFile.name;
    meta.fileSize = pendingFile.size;
    meta.fileType = fileType(pendingFile.name);
    await dbPut('files', { id: pendingFile.id, data: pendingFile.buffer });
  } else if (editingId) {
    const existing = records.find(r => r.id === editingId) || {};
    meta.fileId = existing.fileId;
    meta.fileName = existing.fileName;
    meta.fileSize = existing.fileSize;
    meta.fileType = existing.fileType;
  }

  await dbPut('meta', meta);

  if (editingId) {
    const idx = records.findIndex(r => r.id === editingId);
    if (idx >= 0) records[idx] = meta;
  } else {
    records.unshift(meta);
  }

  pendingFile = null;
  editingId = null;
  closeModal('upload-modal');
  render();

  // 다음 파일 처리
  if (pendingFiles.length) {
    const next = pendingFiles.shift();
    setTimeout(() => prepareUploadModal(next), 150);
  }
}

// ────────────────────────────────────────────
// 편집 / 삭제
// ────────────────────────────────────────────
function editRecord(id) {
  const r = records.find(x => x.id === id);
  if (!r) return;
  editingId = id;
  pendingFile = null;
  tags = [...(r.tags||[])];

  const ft = r.fileType || 'other';
  document.getElementById('upload-modal-title').textContent = '회의록 편집';
  document.getElementById('chosen-icon').textContent = fileEmoji(ft);
  document.getElementById('chosen-name').textContent = r.fileName || '파일 없음';
  document.getElementById('chosen-size').textContent = r.fileSize ? fmtSize(r.fileSize) : '';
  document.getElementById('m-date').value = r.date || '';
  document.getElementById('m-title').value = r.title || '';
  document.getElementById('m-cat').value = r.category || '';
  document.getElementById('m-attendees').value = r.attendees || '';
  document.getElementById('m-note').value = r.note || '';
  renderTagChips();
  openModal('upload-modal');
}

async function deleteRecord(id) {
  if (!confirm('이 회의록을 삭제하시겠습니까?')) return;
  const r = records.find(x => x.id === id);
  if (r && r.fileId) await dbDelete('files', r.fileId).catch(()=>{});
  await dbDelete('meta', id).catch(()=>{});
  records = records.filter(x => x.id !== id);
  render();
}

// ────────────────────────────────────────────
// 업로드 모달 열기 (파일 선택 없이)
// ────────────────────────────────────────────
function openUploadModal() {
  document.getElementById('file-input').click();
}

// ────────────────────────────────────────────
// 태그
// ────────────────────────────────────────────
function renderTagChips() {
  document.getElementById('tag-chips').innerHTML = tags.map((t,i) =>
    `<span class="tchip">${esc(t)}<button type="button" onclick="removeTag(${i})">×</button></span>`
  ).join('');
}
function onTagKey(e) {
  if (e.key==='Enter'||e.key===',') {
    e.preventDefault();
    const v = e.target.value.trim().replace(/,$/,'');
    if (v && !tags.includes(v)) { tags.push(v); renderTagChips(); }
    e.target.value = '';
  }
}
function removeTag(i) { tags.splice(i,1); renderTagChips(); }

// ────────────────────────────────────────────
// 필터
// ────────────────────────────────────────────
function setCat(c) { filterCat = c; render(); }
function setType(t) { filterType = t; render(); }
function setYear(y) { filterYear = filterYear===y?'all':y; render(); }

// ────────────────────────────────────────────
// 모달 헬퍼
// ────────────────────────────────────────────
const MODALS = ['upload-modal', 'view-modal'];
function closeAllModals() { MODALS.forEach(id => { document.getElementById(id).hidden = true; }); }
function closeModal(id) { document.getElementById(id).hidden = true; }
function openModal(id) { closeAllModals(); document.getElementById(id).hidden = false; }
function overlayClose(e, id) { if (e.target.classList.contains('overlay')) closeModal(id); }
document.addEventListener('keydown', e => { if (e.key==='Escape') closeAllModals(); });

// ────────────────────────────────────────────
// 테마
// ────────────────────────────────────────────
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('theme-btn').textContent = next==='dark'?'☀️':'🌙';
  try { localStorage.setItem('theme', next); } catch {}
}

// ────────────────────────────────────────────
// 초기화
// ────────────────────────────────────────────
async function init() {
  try {
    const saved = localStorage.getItem('theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
      document.getElementById('theme-btn').textContent = saved==='dark'?'☀️':'🌙';
    }
  } catch {}

  await openDB();
  records = await dbGetAll('meta');
  records.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  render();
}
init();
</script>
