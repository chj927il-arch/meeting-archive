<!DOCTYPE html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>회의록 아카이브</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- mammoth (docx 파싱) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <style>
    [hidden] { display: none !important; }

    :root {
      --bg:#0f0f13; --bg-card:#17171d; --bg-card2:#1e1e27; --bg-side:#13131a;
      --fg:#e8e8f0; --fg-muted:#8888a0; --fg-subtle:#555568;
      --border:#2a2a38; --border2:#333345;
      --accent:#7c6af7; --accent-lt:#1e1a40; --accent-dim:#5a4fd4;
      --teal:#2dd4bf; --teal-lt:#0d2b28;
      --amber:#f59e0b; --amber-lt:#2a1f08;
      --rose:#f43f5e; --rose-lt:#2a0f16;
      --green:#22c55e; --green-lt:#0a2016;
      --shadow:0 2px 12px rgba(0,0,0,.4);
      --r:10px; --r-sm:6px;
      color-scheme:dark;
    }
    :root[data-theme="light"] {
      --bg:#f4f3f8; --bg-card:#fff; --bg-card2:#f8f7fc; --bg-side:#eeedf4;
      --fg:#1a1a2e; --fg-muted:#5a5a78; --fg-subtle:#9a9ab0;
      --border:#e0dff0; --border2:#d0cfea;
      --accent:#6c5ce7; --accent-lt:#ede9ff; --accent-dim:#5a4fd4;
      --teal:#0d9488; --teal-lt:#ccfbf1;
      --amber:#d97706; --amber-lt:#fef3c7;
      --rose:#e11d48; --rose-lt:#ffe4e6;
      --green:#16a34a; --green-lt:#dcfce7;
      --shadow:0 2px 12px rgba(0,0,0,.08);
      color-scheme:light;
    }

    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    body{
      font-family:'Pretendard','Pretendard Variable','Apple SD Gothic Neo',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
      background:var(--bg);color:var(--fg);font-size:15px;line-height:1.7;
      display:flex;flex-direction:column;
    }

    /* ── 헤더 ── */
    .hdr{
      background:var(--bg-side);border-bottom:1px solid var(--border);
      padding:0 24px;height:52px;
      display:flex;align-items:center;justify-content:space-between;
      position:sticky;top:env(safe-area-inset-top,0);z-index:200;
    }
    .hdr-brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:800;letter-spacing:-.3px;}
    .brand-dot{width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;}
    .hdr-actions{display:flex;gap:8px;align-items:center;}

    /* ── 페이지 ── */
    .page{max-width:1280px;margin:0 auto;padding:24px 24px 60px;width:100%;}

    .page-head{margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
    .page-head-left h1{font-size:22px;font-weight:800;letter-spacing:-.5px;line-height:1.2;margin-bottom:2px;}
    .page-head-left p{font-size:13px;color:var(--fg-muted);}
    .stats-row{display:flex;gap:10px;flex-wrap:wrap;}
    .stat-chip{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-sm);padding:6px 14px;display:flex;align-items:baseline;gap:8px;}
    .stat-num{font-size:18px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;}
    .stat-label{font-size:11px;color:var(--fg-muted);letter-spacing:.03em;}

    /* ── 검색/필터 ── */
    .search-area{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:16px;display:flex;flex-direction:column;gap:12px;}
    .search-row{display:flex;gap:10px;flex-wrap:wrap;}
    .search-wrap{flex:1;min-width:200px;position:relative;}
    .search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--fg-subtle);pointer-events:none;}
    .search-wrap input{width:100%;padding:9px 12px 9px 34px;background:var(--bg-card2);border:1px solid var(--border2);border-radius:var(--r-sm);color:var(--fg);font-family:inherit;font-size:14px;outline:none;transition:border-color .15s;}
    .search-wrap input::placeholder{color:var(--fg-subtle);}
    .search-wrap input:focus{border-color:var(--accent);}
    .filter-sel{padding:9px 12px;background:var(--bg-card2);border:1px solid var(--border2);border-radius:var(--r-sm);color:var(--fg);font-family:inherit;font-size:13px;outline:none;cursor:pointer;min-width:120px;}
    .filter-sel:focus{border-color:var(--accent);}
    .tag-filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
    .tag-filter-label{font-size:11px;color:var(--fg-subtle);white-space:nowrap;}
    .qtag{padding:4px 10px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--fg-muted);font-family:inherit;font-size:12px;cursor:pointer;transition:all .12s;white-space:nowrap;}
    .qtag:hover{border-color:var(--accent);color:var(--accent);}
    .qtag.on{background:var(--accent-lt);border-color:var(--accent);color:var(--accent);font-weight:600;}

    .result-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
    .result-count{font-size:13px;color:var(--fg-muted);}
    .result-count strong{color:var(--fg);font-weight:600;}
    .sort-sel{padding:6px 10px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--fg);font-family:inherit;font-size:13px;outline:none;}

    /* ── 카드 그리드 ── */
    .card-list{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:stretch;}
    @media(max-width:1100px){.card-list{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:620px){.card-list{grid-template-columns:1fr;}}

    .mcard{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;height:380px;transition:border-color .15s,box-shadow .15s;cursor:default;overflow:hidden;}
    .mcard:hover{border-color:var(--accent);box-shadow:var(--shadow);}

    /* 배지 행 — 고정 */
    .mcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:10px;min-height:26px;}
    .mcard-badges{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
    .badge{font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;letter-spacing:.03em;white-space:nowrap;}
    .badge-cat{background:var(--accent-lt);color:var(--accent);}
    .badge-date{background:var(--bg-card2);color:var(--fg-muted);border:1px solid var(--border);}
    .badge-ai{background:var(--teal-lt);color:var(--teal);}
    .badge-file-pdf{background:var(--rose-lt);color:var(--rose);}
    .badge-file-word{background:#1a2840;color:#5a90d9;}
    :root[data-theme="light"] .badge-file-word{background:#dbeafe;color:#1d4ed8;}
    .badge-file-hwp{background:var(--green-lt);color:var(--green);}
    .badge-file-other{background:var(--bg-card2);color:var(--fg-muted);}
    .card-actions{display:flex;gap:4px;align-items:center;flex-shrink:0;}

    /* 제목 — 2줄 클램프 */
    .mcard-title{font-size:15px;font-weight:700;letter-spacing:-.3px;line-height:1.45;margin-bottom:8px;cursor:pointer;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
    .mcard-title:hover{color:var(--accent);}

    /* 참석자 — 1줄 말줄임 */
    .mcard-meta{font-size:12px;color:var(--fg-subtle);margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    /* 요약 — 개조식 불릿, 자연 높이 (내용이 짧으므로 클램프 불필요) */
    .mcard-summary{font-size:13px;color:var(--fg-muted);line-height:1.8;margin-bottom:10px;white-space:pre-line;}

    /* 시사점 박스 — 자연 높이 */
    .implication{background:var(--teal-lt);border-left:3px solid var(--teal);border-radius:0 var(--r-sm) var(--r-sm) 0;padding:9px 12px;margin-bottom:10px;}
    :root[data-theme="light"] .implication{background:#f0fdfa;}
    .implication-label{font-size:10px;font-weight:700;color:var(--teal);letter-spacing:.05em;margin-bottom:4px;}
    .implication-text{font-size:13px;color:var(--fg-muted);line-height:1.8;white-space:pre-line;}

    /* 푸터 — 항상 바닥에 */
    .mcard-footer{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--border);gap:6px;}
    .mcard-file-info{font-size:12px;color:var(--fg-subtle);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;}

    .mcard-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px;}
    .mtag{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--accent-lt);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);font-weight:600;}
    .no-ai-notice{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;background:var(--amber-lt);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);border-radius:var(--r-sm);margin-bottom:8px;font-size:12px;color:var(--amber);}
    :root[data-theme="light"] .no-ai-notice{background:#fef3c7;border-color:#fcd34d;}

    /* ── 버튼 ── */
    .btn{display:inline-flex;align-items:center;gap:5px;padding:7px 16px;border-radius:var(--r-sm);border:none;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:opacity .12s,background .12s;}
    .btn:active{opacity:.8;}
    .btn-primary{background:var(--accent);color:#fff;}
    .btn-primary:hover{background:var(--accent-dim);}
    .btn-ghost{background:transparent;color:var(--fg-muted);border:1px solid var(--border);}
    .btn-ghost:hover{border-color:var(--border2);color:var(--fg);}
    .btn-view{background:var(--accent-lt);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);}
    .btn-view:hover{background:var(--accent);color:#fff;}
    .btn-sm{padding:5px 12px;font-size:12px;}
    .btn-del{background:transparent;color:var(--fg-subtle);border:1px solid transparent;}
    .btn-del:hover{color:var(--rose);border-color:var(--rose-lt);background:var(--rose-lt);}
    .btn-icon{padding:6px 10px;font-size:15px;}

    /* ── 드롭존 ── */
    .drop-zone{border:2px dashed var(--border2);border-radius:var(--r);padding:14px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;margin-bottom:14px;background:var(--bg-card);display:flex;align-items:center;justify-content:center;gap:12px;}
    .drop-zone:hover,.drop-zone.dragover{border-color:var(--accent);background:var(--accent-lt);}
    .drop-icon{font-size:22px;}
    .drop-text{font-size:13px;color:var(--fg-muted);}
    .drop-text strong{color:var(--accent);}
    .drop-sub{font-size:11px;color:var(--fg-subtle);margin-top:2px;}
    #file-input{display:none;}

    /* ── 빈 상태 ── */
    .empty{text-align:center;padding:60px 20px;color:var(--fg-subtle);}
    .empty-icon{font-size:48px;opacity:.3;margin-bottom:12px;}
    .empty h3{font-size:16px;color:var(--fg-muted);margin-bottom:6px;}

    /* ── 모달/오버레이 ── */
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;z-index:300;padding:28px 16px;overflow-y:auto;}
    .modal{background:var(--bg-card);border:1px solid var(--border2);border-radius:14px;width:100%;max-width:560px;margin:auto;box-shadow:0 8px 40px rgba(0,0,0,.5);}
    .modal-hd{padding:18px 22px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
    .modal-hd h2{font-size:18px;font-weight:700;letter-spacing:-.3px;}
    .modal-x{width:28px;height:28px;border-radius:50%;border:none;background:var(--bg-card2);color:var(--fg-muted);cursor:pointer;font-size:15px;display:flex;align-items:center;justify-content:center;}
    .modal-x:hover{background:var(--border);}
    .modal-bd{padding:18px 22px;display:flex;flex-direction:column;gap:14px;}
    .modal-ft{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;align-items:center;}

    /* ── 폼 ── */
    .fg{display:flex;flex-direction:column;gap:5px;}
    .fl{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-muted);}
    .fi,.fta{padding:9px 12px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--bg-card2);color:var(--fg);font-family:inherit;font-size:15px;outline:none;transition:border-color .15s;width:100%;}
    .fi:focus,.fta:focus{border-color:var(--accent);}
    .fi::placeholder,.fta::placeholder{color:var(--fg-subtle);}
    .fta{resize:vertical;min-height:80px;line-height:1.6;}
    .frow{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

    /* 선택된 파일 */
    .file-chosen{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--bg-card2);}
    .fc-name{flex:1;font-size:13px;color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .fc-size{font-size:12px;color:var(--fg-subtle);flex-shrink:0;font-variant-numeric:tabular-nums;}

    /* 카테고리 콤보 */
    .cat-combo{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
    .cat-preset-list{display:flex;gap:6px;flex-wrap:wrap;}
    .cat-chip{padding:5px 12px;border-radius:20px;border:1px solid var(--border2);background:transparent;color:var(--fg-muted);font-family:inherit;font-size:13px;cursor:pointer;transition:all .12s;}
    .cat-chip:hover{border-color:var(--accent);color:var(--accent);}
    .cat-chip.on{background:var(--accent-lt);border-color:var(--accent);color:var(--accent);font-weight:600;}
    .cat-custom{display:flex;gap:6px;align-items:center;margin-top:6px;}
    .cat-custom input{flex:1;padding:7px 10px;border:1px solid var(--border2);border-radius:var(--r-sm);background:var(--bg-card2);color:var(--fg);font-family:inherit;font-size:13px;outline:none;}
    .cat-custom input:focus{border-color:var(--accent);}
    .cat-custom input::placeholder{color:var(--fg-subtle);}

    /* AI 로딩 */
    .ai-loading{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px;color:var(--fg-muted);font-size:14px;}
    .spinner{width:28px;height:28px;border:3px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .ai-status{font-size:13px;color:var(--fg-muted);text-align:center;}

    /* API 키 알림 */
    .api-warn{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--amber-lt);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);border-radius:var(--r-sm);font-size:13px;color:var(--amber);}
    :root[data-theme="light"] .api-warn{background:#fef3c7;border-color:#fcd34d;}

    /* 뷰어 */
    .view-modal{max-width:820px;}
    .view-meta{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:14px;}
    .vm-item{display:flex;flex-direction:column;gap:2px;}
    .vm-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-subtle);}
    .vm-value{font-size:13px;font-weight:500;}
    .view-summary-text{font-size:15px;color:var(--fg-muted);line-height:1.8;white-space:pre-wrap;}
    .pdf-frame{width:100%;height:500px;border:1px solid var(--border);border-radius:var(--r-sm);}
    .download-box{display:flex;flex-direction:column;align-items:center;gap:12px;padding:28px;border:1px solid var(--border2);border-radius:var(--r);background:var(--bg-card2);}
    .download-box .dl-icon{font-size:36px;}
    .download-box p{font-size:13px;color:var(--fg-muted);}
    .view-impl-box{background:var(--teal-lt);border:1px solid color-mix(in srgb,var(--teal) 25%,transparent);border-radius:var(--r-sm);padding:14px 16px;}
    :root[data-theme="light"] .view-impl-box{background:#f0fdfa;border-color:#99f6e4;}
    .view-impl-label{font-size:11px;font-weight:700;color:var(--teal);letter-spacing:.04em;margin-bottom:6px;}
    .view-impl-text{font-size:15px;color:var(--fg-muted);line-height:1.8;white-space:pre-wrap;}
    .docx-preview{max-height:480px;overflow-y:auto;padding:16px;border:1px solid var(--border);border-radius:var(--r-sm);background:var(--bg-card2);font-size:14px;line-height:1.8;color:var(--fg);}
    .docx-preview h1,.docx-preview h2,.docx-preview h3{font-weight:700;margin:12px 0 6px;color:var(--fg);}
    .docx-preview p{margin-bottom:8px;}
    .docx-preview table{border-collapse:collapse;width:100%;margin-bottom:12px;}
    .docx-preview td,.docx-preview th{border:1px solid var(--border2);padding:6px 10px;font-size:13px;}
    .docx-preview strong{font-weight:700;}

    @media(max-width:640px){
      .page{padding:16px 12px 40px;}
      .page-head{flex-direction:column;align-items:flex-start;}
      .frow{grid-template-columns:1fr;}
      .search-row{flex-direction:column;}
    }
    ::-webkit-scrollbar{width:5px;}
    ::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
  </style>
</head>
<body>

<header class="hdr">
  <div class="hdr-brand">
    <div class="brand-dot">📋</div>
    회의록 아카이브
  </div>
  <div class="hdr-actions">
    <button class="btn btn-ghost btn-icon" onclick="openSettings()" title="API 키 설정">⚙️</button>
    <button class="btn btn-ghost btn-sm" onclick="toggleTheme()" id="theme-btn">☀️</button>
    <button class="btn btn-primary btn-sm" onclick="document.getElementById('file-input').click()">+ 파일 추가</button>
  </div>
</header>

<div class="page">
  <div class="page-head">
    <div class="page-head-left">
      <h1>대표이사 주재 회의록</h1>
      <p>파일 업로드 시 AI가 요약·시사점을 자동으로 정리합니다</p>
    </div>
    <div class="stats-row">
      <div class="stat-chip"><span class="stat-num" id="stat-total">0</span><span class="stat-label">전체 회의록</span></div>
      <div class="stat-chip"><span class="stat-num" id="stat-recent">—</span><span class="stat-label">최근 회의</span></div>
      <div class="stat-chip"><span class="stat-num" id="stat-cats">0</span><span class="stat-label">카테고리</span></div>
    </div>
  </div>

  <!-- 검색/필터 -->
  <div class="search-area">
    <div class="search-row">
      <div class="search-wrap">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="q" type="text" placeholder="키워드 입력 (예: 예산, 인사, 사업계획…)" oninput="render()" />
      </div>
      <select class="filter-sel" id="f-year" onchange="render()"><option value="">전체 연도</option></select>
      <select class="filter-sel" id="f-cat" onchange="render()"><option value="">전체 카테고리</option></select>
      <select class="filter-sel" id="f-type" onchange="render()">
        <option value="">전체 파일</option>
        <option value="pdf">PDF</option>
        <option value="word">Word</option>
        <option value="hwp">HWP</option>
      </select>
    </div>
    <div class="tag-filters">
      <span class="tag-filter-label">태그 →</span>
      <div id="qtag-list" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
    </div>
  </div>

  <!-- 드롭존 -->
  <div class="drop-zone" id="drop-zone"
       onclick="document.getElementById('file-input').click()"
       ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event)">
    <div class="drop-icon">📂</div>
    <div>
      <div class="drop-text"><strong>클릭 또는 드래그</strong>하여 회의록 파일 추가</div>
      <div class="drop-sub">PDF · Word(.docx) · HWP — 저장 시 AI가 자동 요약</div>
    </div>
  </div>

<script>
// ── PDF.js 워커 설정 ──
if (typeof pdfjsLib !== 'undefined') {
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
}

// ── IndexedDB ──
const DB_NAME = 'meeting_archive_v2', DB_VER = 1;
let db;
function openDB() {
  return new Promise((res,rej) => {
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('files')) d.createObjectStore('files', {keyPath:'id'});
      if (!d.objectStoreNames.contains('meta'))  d.createObjectStore('meta',  {keyPath:'id'});
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror = () => rej(req.error);
  });
}
const dbPut = (store,obj) => new Promise((res,rej) => { const tx=db.transaction(store,'readwrite'); tx.objectStore(store).put(obj).onsuccess=e=>res(e.target.result); tx.onerror=()=>rej(tx.error); });
const dbGetAll = store => new Promise((res,rej) => { const tx=db.transaction(store,'readonly'); const req=tx.objectStore(store).getAll(); req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); });
const dbGet = (store,key) => new Promise((res,rej) => { const tx=db.transaction(store,'readonly'); const req=tx.objectStore(store).get(key); req.onsuccess=()=>res(req.result); req.onerror=()=>rej(req.error); });
const dbDelete = (store,key) => new Promise((res,rej) => { const tx=db.transaction(store,'readwrite'); tx.objectStore(store).delete(key).onsuccess=()=>res(); tx.onerror=()=>rej(tx.error); });

// ── 상태 ──
let records = [];
let pendingFile = null;
let pendingFiles = [];
let editingId = null;
let activeTagFilter = '';

// 카테고리 기본값 (가나다순)
const DEFAULT_CATS = ['경영회의','기획회의','마케팅','모집','신사업','전략'];

function getCats() {
  try {
    const saved = JSON.parse(localStorage.getItem('cats') || '[]');
    const all = [...new Set([...DEFAULT_CATS, ...saved, ...records.map(r=>r.category).filter(Boolean)])];
    return all.sort((a,b) => a.localeCompare(b,'ko'));
  } catch { return DEFAULT_CATS; }
}
function saveCat(cat) {
  try {
    const saved = JSON.parse(localStorage.getItem('cats') || '[]');
    if (!saved.includes(cat)) { saved.push(cat); localStorage.setItem('cats', JSON.stringify(saved)); }
  } catch {}
}

// ── API 키 ──
function getApiKey() { try { return localStorage.getItem('anthropic_api_key') || ''; } catch { return ''; } }
function saveApiKey() {
  const key = document.getElementById('api-key-input').value.trim();
  try { localStorage.setItem('anthropic_api_key', key); } catch {}
  closeModal('settings-modal');
}
function openSettings() {
  document.getElementById('api-key-input').value = getApiKey();
  openModal('settings-modal');
}

// ── 유틸 ──
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function fileType(name) { const e=(name||'').split('.').pop().toLowerCase(); if(e==='pdf')return'pdf'; if(['doc','docx'].includes(e))return'word'; if(['hwp','hwpx'].includes(e))return'hwp'; return'other'; }
function fileEmoji(t) { return {pdf:'📕',word:'📘',hwp:'📗',other:'📄'}[t]||'📄'; }
function fileBadge(t) { return {pdf:'badge-file-pdf',word:'badge-file-word',hwp:'badge-file-hwp',other:'badge-file-other'}[t]||'badge-file-other'; }
function fileLabel(t) { return {pdf:'PDF',word:'Word',hwp:'HWP',other:'기타'}[t]||'기타'; }
function fmtSize(b) { if(!b)return''; if(b<1024)return b+' B'; if(b<1048576)return(b/1024).toFixed(1)+' KB'; return(b/1048576).toFixed(1)+' MB'; }
function fmtDate(d) { if(!d)return''; const[y,m,dd]=d.split('-'); return`${y}. ${+m}. ${+dd}.`; }

// ── 텍스트 추출 ──
async function extractText(buffer, fileName) {
  const ft = fileType(fileName);
  let text = '';
  try {
    if (ft === 'pdf') {
      const pdf = await pdfjsLib.getDocument({data: new Uint8Array(buffer)}).promise;
      const pages = [];
      for (let i = 1; i <= Math.min(pdf.numPages, 30); i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        pages.push(content.items.map(item => item.str).join(' '));
      }
      text = pages.join('\n');
    } else if (ft === 'word') {
      const result = await mammoth.extractRawText({arrayBuffer: buffer});
      text = result.value;
    } else {
      // HWP: 바이너리 포맷 → 텍스트 추출 불가, 빈 문자열 반환
      text = '';
    }
  } catch (e) {
    console.warn('텍스트 추출 실패:', e);
    text = '';
  }
  return text.slice(0, 40000); // 최대 4만자
}

// ── Gemini API 호출 ──
async function callClaude(fileText, fileName, attendees) {
  const apiKey = getApiKey();
  if (!apiKey) throw new Error('API 키가 없습니다');

  const hasText = fileText && fileText.trim().length > 100;
  const prompt = hasText
    ? `다음은 회의록 파일("${fileName}")의 내용입니다.\n\n---\n${fileText}\n---\n\n위 내용을 분석하여 JSON으로만 응답해주세요 (마크다운·코드블록 없이 순수 JSON만).\n\n규칙 (반드시 준수):\n- summary: 핵심 안건을 개조식 불릿 2~3개로 작성. 각 항목은 "• "로 시작, 15자 이내 단문. 줄바꿈(\\n)으로 구분.\n- implication: 핵심 결정사항·액션아이템을 개조식 불릿 2~3개로 작성. 각 항목은 "• "로 시작, 20자 이내 단문. 줄바꿈(\\n)으로 구분.\n- tags: 핵심 키워드 3~5개, 짧은 명사/명사구.\n- attendees: 문서에서 추출한 참석자 이름 (쉼표 구분).\n\n예시:\n{\n  "attendees": "대표이사, 기획팀장",\n  "summary": "• 신규 가맹점 모집 전략 논의\\n• 온라인 마케팅 예산 확정",\n  "implication": "• 5월까지 랜딩페이지 제작\\n• 마케팅팀 예산 3천만원 승인",\n  "tags": ["가맹점모집", "마케팅예산", "온라인전략"]\n}`
    : `JSON으로만 응답:\n{\n  "attendees": "",\n  "summary": "• HWP 파일은 자동 추출 불가",\n  "implication": "• 파일을 직접 열어 확인 필요",\n  "tags": []\n}`;

  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
  const resp = await fetch(url, {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { maxOutputTokens: 4096, temperature: 0.3 },
    }),
  });

  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || `API 오류 (${resp.status})`);
  }

  const data = await resp.json();
  const raw = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim() || '';
  // 마크다운 코드블록 제거 후 JSON 추출 (앞뒤 ``` 모두 제거)
  const cleaned = raw.replace(/```(?:json)?/gi, '').trim();
  const jsonMatch = cleaned.match(/\{[\s\S]*\}/);
  if (!jsonMatch) {
    console.error('Gemini raw response:', raw);
    throw new Error('응답 파싱 실패 — 원시 응답: ' + raw.slice(0, 200));
  }
  try {
    return JSON.parse(jsonMatch[0]);
  } catch(e) {
    console.error('JSON parse error:', jsonMatch[0]);
    throw new Error('JSON 파싱 오류: ' + e.message);
  }
}

// ── 렌더 ──
function getFiltered() {
  const q = (document.getElementById('q').value||'').toLowerCase().trim();
  const yr = document.getElementById('f-year').value;
  const cat = document.getElementById('f-cat').value;
  const ft = document.getElementById('f-type').value;
  let list = records.filter(r => {
    if (yr && !(r.date||'').startsWith(yr)) return false;
    if (cat && r.category !== cat) return false;
    if (ft && r.fileType !== ft) return false;
    if (activeTagFilter && !(r.tags||[]).includes(activeTagFilter)) return false;
    if (q) {
      const hay = `${r.title} ${r.attendees} ${r.summary} ${r.implication} ${(r.tags||[]).join(' ')}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  const sort = document.getElementById('sort').value;
  if (sort==='newest') list.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  else if (sort==='oldest') list.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  else list.sort((a,b)=>(a.title||'').localeCompare(b.title||''));
  return list;
}

function updateFilters() {
  const years = [...new Set(records.map(r=>(r.date||'').slice(0,4)).filter(Boolean))].sort((a,b)=>b-a);
  const ysel = document.getElementById('f-year'); const curY = ysel.value;
  ysel.innerHTML = '<option value="">전체 연도</option>' + years.map(y=>`<option value="${y}">${y}년</option>`).join('');
  if (curY) ysel.value = curY;

  const cats = [...new Set(records.map(r=>r.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
  const csel = document.getElementById('f-cat'); const curC = csel.value;
  csel.innerHTML = '<option value="">전체 카테고리</option>' + cats.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  if (curC) csel.value = curC;

  const tagCount = {};
  records.forEach(r=>(r.tags||[]).forEach(t=>{ tagCount[t]=(tagCount[t]||0)+1; }));
  const topTags = Object.entries(tagCount).sort((a,b)=>b[1]-a[1]).slice(0,12).map(([t])=>t);
  document.getElementById('qtag-list').innerHTML = topTags.map(t=>
    `<button class="qtag${activeTagFilter===t?' on':''}" onclick="toggleTagFilter('${esc(t)}')">${esc(t)}</button>`
  ).join('');

  document.getElementById('stat-total').textContent = records.length;
  document.getElementById('stat-cats').textContent = cats.length || 0;
  if (records.length) {
    const latest = [...records].sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0];
    document.getElementById('stat-recent').textContent = latest.date ? fmtDate(latest.date) : '—';
  } else {
    document.getElementById('stat-recent').textContent = '—';
  }
}

function render() {
  updateFilters();
  const list = getFiltered();
  document.getElementById('result-count').innerHTML = `<strong>${list.length}</strong>건`;
  const cl = document.getElementById('card-list');

  if (!list.length) {
    cl.innerHTML = `<div class="empty"><div class="empty-icon">📋</div><h3>${records.length===0?'아직 등록된 회의록이 없습니다':'검색 결과가 없습니다'}</h3><p>${records.length===0?'위 영역에 파일을 올려주세요.':'다른 키워드나 필터를 사용해보세요.'}</p></div>`;
    return;
  }

  cl.innerHTML = list.map(r => {
    const ft = r.fileType||'other';
    return `<div class="mcard" data-id="${r.id}">
      <div class="mcard-top">
        <div class="mcard-badges">
          ${r.category?`<span class="badge badge-cat">${esc(r.category)}</span>`:''}
          ${r.date?`<span class="badge badge-date">📅 ${fmtDate(r.date)}</span>`:''}
          ${r.fileName?`<span class="badge ${fileBadge(ft)}">${fileLabel(ft)}</span>`:''}
          ${r.aiGenerated?`<span class="badge badge-ai">✨ AI 요약</span>`:''}
        </div>
        <div class="card-actions" onclick="event.stopPropagation()">
          <button class="btn btn-ghost btn-sm" onclick="editRecord('${r.id}')">편집</button>
          <button class="btn btn-del btn-sm" onclick="deleteRecord('${r.id}')">삭제</button>
        </div>
      </div>
      <div class="mcard-title" onclick="viewRecord('${r.id}')">${esc(r.title)}</div>
      ${r.attendees?`<div class="mcard-meta">👥 ${esc(r.attendees)}</div>`:''}
      ${r.summary?`<div class="mcard-summary">${esc(r.summary)}</div>`:''}
      ${r.tags&&r.tags.length?`<div class="mcard-tags">${r.tags.map(t=>`<span class="mtag">${esc(t)}</span>`).join('')}</div>`:''}
      ${r.implication?`<div class="implication"><div class="implication-label">💡 시사점 · 핵심결정사항</div><div class="implication-text">${esc(r.implication)}</div></div>`:''}
      ${!r.aiGenerated&&r.fileId?`<div class="no-ai-notice"><span>AI 분석 전</span><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();reanalyze('${r.id}')">✨ AI 재분석</button></div>`:''}
      <div class="mcard-footer">
        <div class="mcard-file-info">${r.fileName?`${fileEmoji(ft)} ${esc(r.fileName)}` :'파일 없음'}</div>
        ${r.fileId?`<button class="btn btn-view btn-sm" onclick="viewRecord('${r.id}')">보기 ↗</button>`:''}
      </div>
    </div>`;
  }).join('');
}

// ── 뷰어 ──
async function viewRecord(id) {
  const r = records.find(x=>x.id===id); if (!r) return;
  document.getElementById('view-title').textContent = r.title;
  document.getElementById('view-meta').innerHTML = [
    r.date?`<div class="vm-item"><div class="vm-label">날짜</div><div class="vm-value">${fmtDate(r.date)}</div></div>`:'',
    r.category?`<div class="vm-item"><div class="vm-label">카테고리</div><div class="vm-value">${esc(r.category)}</div></div>`:'',
    r.attendees?`<div class="vm-item"><div class="vm-label">참석자</div><div class="vm-value">${esc(r.attendees)}</div></div>`:'',
    r.fileName?`<div class="vm-item"><div class="vm-label">파일</div><div class="vm-value">${esc(r.fileName)}${r.fileSize?' · '+fmtSize(r.fileSize):''}</div></div>`:'',
  ].join('');

  const fa = document.getElementById('view-file-area'); fa.innerHTML = '';
  document.getElementById('view-dl-btn').hidden = true;
  if (r.fileId) {
    const stored = await dbGet('files', r.fileId).catch(()=>null);
    if (stored && stored.data) {
      const dlBlob = r.fileType==='pdf'
        ? new Blob([stored.data], {type:'application/pdf'})
        : new Blob([stored.data]);
      const dlUrl = URL.createObjectURL(dlBlob);
      // 다운로드 버튼 설정
      const dlBtn = document.getElementById('view-dl-btn');
      dlBtn.hidden = false;
      dlBtn.onclick = () => { const a=document.createElement('a'); a.href=dlUrl; a.download=r.fileName||'file'; a.click(); };

      if (r.fileType==='pdf') {
        fa.innerHTML = `<iframe class="pdf-frame" src="${dlUrl}"></iframe>`;
      } else if (r.fileType==='word') {
        // DOCX → HTML 렌더
        try {
          const result = await mammoth.convertToHtml({arrayBuffer: stored.data});
          fa.innerHTML = `<div class="docx-preview">${result.value}</div>`;
        } catch {
          fa.innerHTML = `<div class="download-box"><div class="dl-icon">${fileEmoji(r.fileType)}</div><p>미리보기를 지원하지 않는 형식입니다</p></div>`;
        }
      } else {
        fa.innerHTML = `<div class="download-box"><div class="dl-icon">${fileEmoji(r.fileType)}</div><p>${esc(r.fileName)} — 아래 버튼으로 다운로드하세요</p></div>`;
      }
    }
  }

  const sw = document.getElementById('view-summary-wrap');
  if (r.summary) { sw.hidden=false; document.getElementById('view-summary').textContent=r.summary; } else sw.hidden=true;
  const iw = document.getElementById('view-impl-wrap');
  if (r.implication) { iw.hidden=false; document.getElementById('view-impl').textContent=r.implication; } else iw.hidden=true;
  document.getElementById('view-edit-btn').onclick = () => { closeModal('view-modal'); editRecord(id); };
  openModal('view-modal');
}

// ── 파일 처리 ──
function onDragOver(e) { e.preventDefault(); document.getElementById('drop-zone').classList.add('dragover'); }
function onDragLeave() { document.getElementById('drop-zone').classList.remove('dragover'); }
function onDrop(e) { e.preventDefault(); document.getElementById('drop-zone').classList.remove('dragover'); const f=[...e.dataTransfer.files]; if(f.length) handleFiles(f); }
function onFileSelect(e) { const f=[...e.target.files]; e.target.value=''; if(f.length) handleFiles(f); }

async function handleFiles(files) {
  pendingFiles = files.length>1 ? files.slice(1) : [];
  await prepareUploadModal(files[0]);
}

async function prepareUploadModal(file) {
  const buf = await file.arrayBuffer();
  pendingFile = {id:uid(), name:file.name, size:file.size, buffer:buf};
  editingId = null;

  const ft = fileType(file.name);
  document.getElementById('upload-modal-title').textContent = '회의록 추가';
  document.getElementById('chosen-icon').textContent = fileEmoji(ft);
  document.getElementById('chosen-name').textContent = file.name;
  document.getElementById('chosen-size').textContent = fmtSize(file.size);
  document.getElementById('m-date').value = new Date().toISOString().slice(0,10);
  document.getElementById('m-cat').value = '';
  document.getElementById('m-attendees').value = '';

  // API 키 경고
  document.getElementById('api-warn').hidden = !!getApiKey();

  // 카테고리 프리셋 칩 렌더
  renderCatChips('');

  // AI 로딩 숨기기
  document.getElementById('ai-loading').hidden = true;
  document.getElementById('save-btn').disabled = false;

  openModal('upload-modal');
  setTimeout(() => document.getElementById('m-attendees').focus(), 50);
}

function renderCatChips(selected) {
  const cats = getCats();
  document.getElementById('cat-dl').innerHTML = cats.map(c=>`<option value="${esc(c)}">`).join('');
  document.getElementById('cat-presets').innerHTML = cats.map(c =>
    `<button type="button" class="cat-chip${selected===c?' on':''}" onclick="selectCat('${esc(c)}')">${esc(c)}</button>`
  ).join('');
}

function selectCat(c) {
  document.getElementById('m-cat').value = c;
  renderCatChips(c);
}

// cat input과 칩 동기화
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('m-cat').addEventListener('input', e => renderCatChips(e.target.value));
});

// ── 저장 ──
async function saveMeta() {
  const saveBtn = document.getElementById('save-btn');
  const aiLoading = document.getElementById('ai-loading');
  const aiStatus = document.getElementById('ai-status');

  const title = (pendingFile ? pendingFile.name.replace(/\.[^/.]+$/,'') : editingId ? (records.find(r=>r.id===editingId)||{}).title : '').trim() || '제목 없음';
  const cat = document.getElementById('m-cat').value.trim();
  if (cat) saveCat(cat);

  const meta = {
    id: editingId || (pendingFile ? pendingFile.id : uid()),
    title,
    date: document.getElementById('m-date').value,
    category: cat,
    attendees: document.getElementById('m-attendees').value.trim(),
    summary: '',
    implication: '',
    tags: [],
    aiGenerated: false,
  };

  if (pendingFile) {
    meta.fileId = pendingFile.id;
    meta.fileName = pendingFile.name;
    meta.fileSize = pendingFile.size;
    meta.fileType = fileType(pendingFile.name);
    await dbPut('files', {id:pendingFile.id, data:pendingFile.buffer});
  } else if (editingId) {
    const ex = records.find(r=>r.id===editingId)||{};
    meta.fileId=ex.fileId; meta.fileName=ex.fileName; meta.fileSize=ex.fileSize; meta.fileType=ex.fileType;
    meta.summary=ex.summary; meta.implication=ex.implication; meta.tags=ex.tags||[];
    meta.aiGenerated=ex.aiGenerated||false;
  }

  // AI 분석
  if (getApiKey() && pendingFile) {
    saveBtn.disabled = true;
    aiLoading.hidden = false;
    aiStatus.textContent = '파일 텍스트 추출 중…';
    try {
      const text = await extractText(pendingFile.buffer, pendingFile.name);
      aiStatus.textContent = 'AI가 요약 중… (10~20초 소요)';
      const result = await callClaude(text, pendingFile.name, meta.attendees);
      meta.summary = result.summary || '';
      meta.implication = result.implication || '';
      // 참석자 필드가 비어있을 때만 AI 추출값 사용
      if (!meta.attendees && result.attendees) {
        meta.attendees = result.attendees;
        document.getElementById('m-attendees').value = result.attendees;
      }
      if (result.tags && Array.isArray(result.tags)) {
        meta.tags = result.tags.map(t => String(t).trim()).filter(Boolean).slice(0, 8);
      }
      meta.aiGenerated = true;
    } catch (e) {
      console.warn('AI 분석 실패:', e);
      aiStatus.textContent = 'AI 분석 실패 (수동 입력 필요): ' + e.message;
      await new Promise(r=>setTimeout(r,1500));
    }
  }

  await dbPut('meta', meta);
  if (editingId) { const idx=records.findIndex(r=>r.id===editingId); if(idx>=0) records[idx]=meta; }
  else records.unshift(meta);

  pendingFile=null; editingId=null;
  closeModal('upload-modal');
  render();

  if (pendingFiles.length) setTimeout(() => prepareUploadModal(pendingFiles.shift()), 150);
}

// ── 편집 ──
function editRecord(id) {
  const r = records.find(x=>x.id===id); if(!r) return;
  editingId=id; pendingFile=null;
  const ft=r.fileType||'other';
  document.getElementById('upload-modal-title').textContent='회의록 편집';
  document.getElementById('chosen-icon').textContent=fileEmoji(ft);
  document.getElementById('chosen-name').textContent=r.fileName||'파일 없음';
  document.getElementById('chosen-size').textContent=r.fileSize?fmtSize(r.fileSize):'';
  document.getElementById('m-date').value=r.date||'';
  document.getElementById('m-cat').value=r.category||'';
  document.getElementById('m-attendees').value=r.attendees||'';
  document.getElementById('api-warn').hidden=true;
  document.getElementById('ai-loading').hidden=true;
  document.getElementById('save-btn').disabled=false;
  renderCatChips(r.category||'');
  openModal('upload-modal');
}

// ── AI 재분석 ──
async function reanalyze(id) {
  if (!getApiKey()) { alert('⚙️ 설정에서 Google AI API 키를 먼저 입력해주세요.'); return; }
  const r = records.find(x=>x.id===id); if (!r||!r.fileId) return;
  const stored = await dbGet('files', r.fileId).catch(()=>null);
  if (!stored||!stored.data) { alert('파일 데이터를 찾을 수 없습니다.'); return; }

  // 카드에 로딩 표시
  const cardEl = document.querySelector(`[data-id="${id}"]`);
  const notice = cardEl ? cardEl.querySelector('.no-ai-notice') : null;
  if (notice) notice.innerHTML = '<span style="color:var(--teal)">✨ AI 분석 중…</span>';

  try {
    const text = await extractText(stored.data, r.fileName);
    const result = await callClaude(text, r.fileName, r.attendees);
    r.summary = result.summary || r.summary;
    r.implication = result.implication || r.implication;
    if (!r.attendees && result.attendees) r.attendees = result.attendees;
    if (result.tags && Array.isArray(result.tags)) {
      r.tags = result.tags.map(t=>String(t).trim()).filter(Boolean).slice(0,8);
    }
    r.aiGenerated = true;
    await dbPut('meta', r);
    render();
  } catch(e) {
    alert('AI 분석 실패: ' + e.message);
    render();
  }
}

async function deleteRecord(id) {
  if (!confirm('이 회의록을 삭제하시겠습니까?')) return;
  const r=records.find(x=>x.id===id);
  if(r&&r.fileId) await dbDelete('files',r.fileId).catch(()=>{});
  await dbDelete('meta',id).catch(()=>{});
  records=records.filter(x=>x.id!==id); render();
}

function toggleTagFilter(t) { activeTagFilter=activeTagFilter===t?'':t; render(); }

// ── 모달 ──
const MODALS=['upload-modal','view-modal','settings-modal'];
function closeAllModals(){MODALS.forEach(id=>document.getElementById(id).hidden=true);}
function closeModal(id){document.getElementById(id).hidden=true;}
function openModal(id){closeAllModals();document.getElementById(id).hidden=false;}
function overlayClose(e,id){if(e.target.classList.contains('overlay'))closeModal(id);}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAllModals();});

// ── 테마 ──
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  document.getElementById('theme-btn').textContent=next==='dark'?'☀️':'🌙';
  try{localStorage.setItem('theme',next);}catch{}
}

// ── 초기화 ──
async function init(){
  try{
    const t=localStorage.getItem('theme');
    if(t){document.documentElement.setAttribute('data-theme',t);document.getElementById('theme-btn').textContent=t==='dark'?'☀️':'🌙';}
  }catch{}
  await openDB();
  records=await dbGetAll('meta');
  records.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  render();
}
init();
</script>
